    <script>
        let audioCtx = null;
        let isMuted = true;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSfx(freq, duration) {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startBgm() {
            if (bgmInterval) clearInterval(bgmInterval);
            initAudio();
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            let step = 0;
            
            bgmInterval = setInterval(() => {
                if (isMuted) return;
                const melody = [0, 2, 4, 2, 5, 4, 7, 6, 4, 5, 3, 4, 2, 0, 1, 0];
                const note = notes[melody[step % melody.length]];
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = note;
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                
                step++;
            }, 260);
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (!isMuted) {
                initAudio();
                startBgm();
                playSfx(523.25, 0.1);
            } else {
                if (bgmInterval) clearInterval(bgmInterval);
            }
            updateApp();

        function calculateFinalScores() {
            let finalScores = { P: 0, I: 0, O: 0, L: 0, C: 0, S: 0 };
            for (let i = 0; i < questions.length; i++) {
                const selectedIdx = selectedOptionIdxs[i];
                if (selectedIdx !== null) {
                    const opt = questions[i].options[selectedIdx];
                    if (opt && opt.score) {
                        Object.keys(opt.score).forEach(key => {
                            finalScores[key] += opt.score[key];
                        });
                    }
                }
            }
            return finalScores;

        function legacyCopyUrl(url) {
            const input = document.createElement('input');
            input.value = url;
            document.body.appendChild(input);

        function setAvatar(key) {
            selectedAvatar = key;
            playSfx(587.33, 0.08);
            updateApp();
        }

        function startTest() {
            if(!userName.trim()) userName = "체리토끼";
            if (isMuted) {
                isMuted = false;
                initAudio();
                startBgm();
            }
            playSfx(880.00, 0.15); 
            currentScreen = "game";
            currentQ = 0;
            selectedOptionIdx = null;
            selectedOptionIdxs = Array(20).fill(null);
            updateApp();
        }

        function selectOption(idx) {
            selectedOptionIdx = idx;
            selectedOptionIdxs[currentQ] = idx;
            playSfx(698.46, 0.05);
            updateApp();
        }

        function prevQuestion() {
            if (currentQ > 0) {
                currentQ -= 1;
                selectedOptionIdx = selectedOptionIdxs[currentQ];
                playSfx(523.25, 0.08);
                updateApp();
            }
        }

        function nextQuestion() {
            if (selectedOptionIdx === null) return;
            playSfx(880.00, 0.1);

            if (currentQ < questions.length - 1) {
                currentQ += 1;
                selectedOptionIdx = selectedOptionIdxs[currentQ];
                updateApp();
            } else {
                currentScreen = "result";
                updateApp();
            }
        }

        function resetTest() {
            userName = "체리토끼";
            selectedAvatar = "cherry";
            currentScreen = "welcome";
            currentQ = 0;
            selectedOptionIdx = null;
            selectedOptionIdxs = Array(20).fill(null);
            playSfx(440.00, 0.1);
            updateApp();
        }

        // Initial app render
        updateApp();
