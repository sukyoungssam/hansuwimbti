<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한수위 - 중등 수행평가 MBTI 진단 테스트</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 레트로 제목용 Jua & 본문 가독성용 Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
        }
        .font-retro {
            font-family: 'Jua', sans-serif;
        }
        .pixel-border {
            border: 3.5px solid #000000;
            box-shadow: 5px 5px 0px #000000;
        }
        .pixel-shadow {
            box-shadow: 4px 4px 0px #000000;
        }
        @keyframes bobbing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bob {
            animation: bobbing 0.7s infinite;
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.02); }
        }
        .animate-title {
            animation: titleFloat 2s ease-in-out infinite;
        }
        .toast-pop {
            animation: popIn 0.3s ease-out forwards;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, 20px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- 다마고치 팩 게임기 프레임 정중앙 배치 -->
    <div id="app" class="w-full max-w-md bg-white pixel-border rounded-[32px] p-5 flex flex-col gap-4 relative overflow-hidden my-auto">
        <!-- 자바스크립트가 여기에 화면을 렌더링합니다 -->
    </div>

    <!-- 토스트 알림 메시지 창 -->
    <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-black text-white px-5 py-3 rounded-2xl font-bold text-sm z-50 shadow-2xl border-2 border-white toast-pop">
        안내 메시지
    </div>

    <!-- 모달 팝업 컨테이너 -->
    <div id="modal-root"></div>

    <script>
        // --- Web Audio API Synth ---
        let audioCtx = null;
        let isMuted = true;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSfx(freq, duration) {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startBgm() {
            if (bgmInterval) clearInterval(bgmInterval);
            initAudio();
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (isMuted) return;
                const melody = [0, 2, 4, 2, 5, 4, 7, 6, 4, 5, 3, 4, 2, 0, 1, 0];
                const note = notes[melody[step % melody.length]];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = note;
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                step++;
            }, 260);
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (!isMuted) {
                initAudio();
                startBgm();
                playSfx(523.25, 0.1);
            } else {
                if (bgmInterval) clearInterval(bgmInterval);
            }
            updateApp();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // --- State Configuration ---
        let userName = "체리토끼";
        let selectedAvatar = "cherry";
        let currentScreen = "welcome"; 
        let currentQ = 0;
        let selectedOptionIdx = null;
        let selectedOptionIdxs = Array(20).fill(null);

        const avatars = {
            cherry: { name: "체리", color: "#FF6B6B" },
            cookie: { name: "쿠키", color: "#4D96FF" },
            jadu: { name: "자두", color: "#FF8AAE" },
            melon: { name: "멜론", color: "#6BCB77" },
            mango: { name: "망고", color: "#FFD93D" }
        };

        const questions = [
            { id: 1, text: "국어 시간에 '한 달 동안 독서를 하고 감상문을 작성해서 제출하라'는 과제를 안내받았다면, 나의 독서 스타일은?", options: [{ text: "첫 주에 읽을 분량과 기록 작성 일정을 완벽히 달력에 나누어 적어두고 지킨다.", score: { P: 2 } }, { text: "대략 일주일 단위로 얼만큼 읽을지 머릿속으로 어렴풋이 선을 긋고 시작한다.", score: { P: 1 } }, { text: "책이 재미있어지거나 영감이 떠오르는 날에 몰아서 많이 읽고 기록한다.", score: { I: 1 } }, { text: "제출 기한이 임박했을 때 며칠 밤을 집중해서 스릴 있게 한 번에 채워 나간다.", score: { I: 2 } }] },
            { id: 2, text: "국어 수행평가로 '나를 바꾼 한 편의 시'라는 주제로 감상문을 쓸 때, 내가 더 공들이는 부분은?", options: [{ text: "교과서에서 배운 문학적 상징과 서사 구조 분석을 완벽한 논리로 풀어내는 데 집중한다.", score: { L: 2 } }, { text: "남들이 잘 쓰지 않는 참신하고 독특한 작품을 선정하여 나만의 개성 있는 시각을 담는다.", score: { O: 2 } }, { text: "문장의 형식이나 정석적인 흐름보다는, 작품을 읽으며 느낀 솔직하고 창의적인 감성을 기술한다.", score: { O: 1 } }, { text: "맞춤법, 원고지 작성법 등 감점 요인을 철저히 점검하고 서론-본론-결론의 정석적인 구조를 맞춘다.", score: { L: 1 } }] },
            { id: 3, text: "국어 모둠 수행평가로 '시사 이슈 토론'을 시작했다. 내가 선호하는 단톡방 소통 방식은?", options: [{ text: "처음부터 끝까지 실시간으로 의견을 공유하며, 작은 결정 하나도 모둠원 전체의 합의를 거친다.", score: { C: 2 } }, { text: "큰 틀의 주제만 같이 정한 뒤, 각자 맡은 하위 논거들을 취합할 때 위주로 대화한다.", score: { C: 1 } }, { text: "모둠원들과 가볍게 의견을 조율하되, 내가 맡은 파트의 논리는 내가 독자적으로 완성하고 싶다.", score: { S: 1 } }, { text: "단톡방에서 감정 소모나 긴 대화를 하기보다는, 처음부터 각자 역할을 명확히 쪼개고 터치하지 않는다.", score: { S: 2 } }] },
            { id: 4, text: "국어 수행평가 주제가 '문학 작품의 재구성'이라고 명시되었다면, 과제를 받아든 나의 반응은?", options: [{ text: "가이드라인이 명확하지 않아 오히려 무엇을 먼저 시작해야 할지 갈팡질팡한다.", score: { L: 2 } }, { text: "예시 양식이 몇 개 있으면 좋겠다고 생각하며 기존 성공 사례를 찾아본다.", score: { L: 1 } }, { text: "내 마음대로 상상력을 펼칠 수 있는 기회라며 신나서 아이디어를 구상한다.", score: { O: 1 } }, { text: "아무도 시도하지 않은 파격적이고 유니크한 포맷을 먼저 고민하며 즐거워한다.", score: { O: 2 } }] },
            { id: 5, text: "영어 말하기 수행평가 대본 제출일이 일주일 남았다. 나의 준비 스타일은?", options: [{ text: "오늘 바로 초안을 쓰고, 매일 문장을 조금씩 다듬으며 완벽하게 외울 때까지 반복 연습한다.", score: { P: 2 } }, { text: "이틀 정도 자료 모은 뒤 삼일째 되는 날 대본 완성하고 여유롭게 연습한다.", score: { P: 1 } }, { text: "마감 이틀 전쯤 한 번에 집중해서 대본 작성하고 직전에 빠르게 암기한다.", score: { I: 1 } }, { text: "전날 밤이나 당일 새벽에 초인적인 집중력을 발휘해 대본을 쓰고 즉석 임기응변으로 발표한다.", score: { I: 2 } }] },
            { id: 6, text: "영어 에세이 쓰기 수행평가에서 더 높은 점수를 받기 위한 나의 필승 전략은?", options: [{ text: "교과서에 나온 핵심 영문법과 필수 어휘를 조목조목 엮어서 감점 없는 문장을 구사한다.", score: { L: 2 } }, { text: "문법이 조금 서툴더라도 내가 전달하고자 하는 메시지의 깊이와 참신함에 승부를 건다.", score: { O: 2 } }, { text: "남들이 쓰는 뻔한 서론 대신 감성적이거나 은유적인 표현을 도입부에 적극 활용한다.", score: { O: 1 } }, { text: "채점 기준표를 꼼꼼히 분석하여 요구하는 문장 개수와 형식을 칼같이 맞춘다.", score: { L: 1 } }] },
            { id: 7, text: "영어 모둠 발표를 위해 역할을 나누어야 한다. 내가 가장 자원하고 싶은 역할은?", options: [{ text: "조원들의 대본을 하나로 매끄럽게 합치고 PPT 디자인을 전체적으로 조율하는 중재자 역할", score: { C: 2 } }, { text: "발표의 메인 서론과 결론의 흐름을 잡고, 조원들이 놓친 부분을 뒤에서 챙겨주는 서포터 역할", score: { C: 1 } }, { text: "내가 조사한 영문 자료의 퀄리티를 극상으로 올려서 우리 조의 점수 뼈대를 세우는 역할", score: { S: 1 } }, { text: "남들의 간섭 없이 내 발표 파트의 영작과 암기만 완벽하게 책임지고 끝내는 역할", score: { S: 2 } }] },
            { id: 8, text: "선생님이 학기말 영어 수행평가 피드백을 주셨을 때, 내가 가장 듣고 싶은 말은?", options: [{ text: "모둠 활동에서 뛰어난 친화력과 배려심으로 소외되는 친구 없이 조를 훌륭하게 이끌었음.", score: { C: 2 } }, { text: "타인의 의견을 경청할 줄 알며, 협동 과제에서 소통의 중심축 역할을 성실히 수행함.", score: { C: 1 } }, { text: "스스로 지식을 탐구하고 문제를 해결하는 독립적인 성취도가 매우 탁월함.", score: { S: 1 } }, { text: "자기 주도적 학습 능력이 우수하며, 본인의 과제에 대해 깊이 있고 책임감 있게 완수함.", score: { S: 2 } }] },
            { id: 9, text: "수학 수행평가로 '실생활 속 수학 개념 찾기 보고서' 과제가 나왔다. 주제를 선정하는 나의 방식은?", options: [{ text: "교과서 뒤쪽에 나오는 정석적인 예시나 선생님이 추천해 준 안전한 범주 안에서 고른다.", score: { L: 2 } }, { text: "기존 만점 선배들의 보고서나 인터넷의 공인된 우수 사례의 논리 구조를 참고한다.", score: { L: 1 } }, { text: "수학과 전혀 관련 없어 보이는 참신한 분야(예: 대중음악, 패션)에서 수학적 원리를 엮어본다.", score: { O: 1 } }, { text: "내 관심사와 완벽히 일치하는 독창적이고 신박한 주제를 제로 베이스에서 새로 개척한다.", score: { O: 2 } }] },
            { id: 10, text: "수학 통계 과제를 해결하기 위해 모둠원들과 데이터를 수집해야 한다. 작업 과정에서 나의 성향은?", options: [{ text: "다 같이 모여서 설문조사 문항을 하나하나 같이 읽어보며 다수결로 최종 수정을 거친다.", score: { C: 2 } }, { text: "대략적인 방향을 정하고, 단톡방에서 의견이 분분할 때 부드럽게 타협점을 찾아낸다.", score: { C: 1 } }, { text: "각자 조사 구역을 칼같이 나누고, 취합할 때 만나서 조사한 자료를 합치는 게 효율적이라 본다.", score: { S: 1 } }, { text: "남들이 데이터를 엉성하게 모을까 봐 걱정되므로, 내 파트만큼은 완벽한 무결점 데이터를 혼자 독립적으로 뽑아낸다.", score: { S: 2 } }] },
            { id: 11, text: "수학 구술 수행평가(풀이 과정 설명하기)를 준비할 때, 내가 중점을 두는 방향은?", options: [{ text: "연산 기호와 공식을 한 줄도 빠뜨리지 않고 교과서 정석대로 차근차근 증명하는 전개", score: { L: 2 } }, { text: "감점 요인이 없도록 풀이 조건의 함정들과 오답 유발 근거를 논리정연하게 짚어내는 전개", score: { L: 1 } }, { text: "비유나 시각 자료를 활용해 친구들이 이해하기 쉽게 발표하는 방식", score: { O: 1 } }, { text: "가르쳐주지 않은 고난도 개념이나 우회 경로를 써서 독창적으로 풀어내는 방식", score: { O: 2 } }] },
            { id: 12, text: "수학 수행평가 문제를 풀다가 아무리 계산해도 중간에 풀이 과정이 막혔을 때, 나의 행동은?", options: [{ text: "풀이를 멈추고 위에서부터 검산하며 조건 중 내가 빠뜨리거나 잘못 적용한 규칙이 없는지 순서대로 역추적한다.", score: { P: 2 } }, { text: "일단 다른 문항들부터 빠르게 풀어 점수를 확보해 두고, 남은 시간에 막힌 문제를 풀 수 있도록 시간 배분을 조정한다.", score: { P: 1 } }, { text: "계속 붙잡고 있으면 머리가 안 돌아가니 잠시 쉬거나 다른 과목을 하다가, 새로운 직관이 떠오를 때 다시 도전한다.", score: { I: 1 } }, { text: "한참 고민해도 안 풀리던 문제가 마감 직전이나 시험지 제출 5분 전에 번뜩이며 풀리는 스릴을 자주 경험한다.", score: { I: 2 } }] },

                    friendDesc: "내가 조사한 무결점 데이터의 가치를 알아보며 리더십 있게 조를 이끌어줄 리더!",
                    cheatTitle: "『한수위』: 깊이 있는 주제 탐구 보고서 서식",
                    cheatDesc: "수집한 단순 자료를 인문학적·사회적 가치와 엮어 깊이 있는 결론으로 마감하는 보고서 서식."
                }
            };

            return map[code] || map["POC"];
        }

        // --- Render Views ---
        function updateApp() {
            const app = document.getElementById('app');
            const audioBtnText = isMuted ? "🎵 BGM OFF" : "🔊 BGM ON";
            const audioBtnColor = isMuted ? "bg-gray-200" : "bg-[#7FFF00]";

            if (currentScreen === "welcome") {
                app.innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <div class="bg-[#FFC0CB] text-black text-xs sm:text-sm font-bold py-1 px-3 rounded-full pixel-border">
                            🎒 중등 수행평가 완벽 가이드
                        </div>
                        <button onclick="toggleMute()" class="${audioBtnColor} text-black text-xs font-bold py-1 px-3 rounded-md pixel-border transition-all">
                            ${audioBtnText}
                        </button>
                    </div>

                    <h1 class="text-5xl sm:text-6xl font-retro font-bold text-center text-[#7FFF00] tracking-wider my-2 select-none animate-title" style="-webkit-text-stroke: 2px #000; filter: drop-shadow(4px 4px 0px #000);">
                        한수위
                    </h1>

                    <div class="bg-[#A3E4D7] p-3 text-center text-base sm:text-lg rounded-2xl pixel-border font-bold">
                        "수행평가 성향을 진단하고 최상위 전략을 찾자!"
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-base sm:text-lg font-bold text-black flex items-center gap-1">🌟 닉네임을 입력해줘!</label>
                        <input type="text" id="nameInput" value="${userName}"
                               onfocus="if(this.value === '체리토끼') { this.value = ''; }"
                               onblur="if(this.value.trim() === '') { this.value = '체리토끼'; } userName = this.value;"
                               oninput="userName = this.value;"
                               class="w-full bg-[#FFFDE7] p-3 text-lg font-bold rounded-xl pixel-border focus:outline-none" placeholder="닉네임 입력...">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-base sm:text-lg font-bold text-black">🐰 캐릭터 아바타 선택</label>
                        <div class="grid grid-cols-5 gap-1 pt-1">
                            ${Object.keys(avatars).map(key => `
                                <button onclick="setAvatar('${key}')" class="flex flex-col items-center p-1 rounded-xl border-2 ${selectedAvatar === key ? 'border-black bg-[#FFFDE7] pixel-shadow font-bold scale-105' : 'border-gray-100 bg-gray-50 opacity-60'} transition-all cursor-pointer">
                                    ${renderPixelAvatar(key, selectedAvatar === key)}
                                    <span class="text-xs mt-1 font-bold">${avatars[key].name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="startTest()" class="w-full mt-2 bg-[#7FFF00] hover:bg-yellow-300 text-black text-xl sm:text-2xl font-retro font-bold p-3.5 rounded-2xl pixel-border transition-all transform active:scale-95 cursor-pointer shadow-[3px_3px_0px_#000]">
                        진단 테스트 시작하기! 🚀
                    </button>
                `;
            } 
            else if (currentScreen === "game") {
                const q = questions[currentQ];
                const progress = Math.round(((currentQ) / questions.length) * 100);
                selectedOptionIdx = selectedOptionIdxs[currentQ];

                const optionsConfigs = [
                    { base: "bg-[#FFF0F0] hover:bg-[#FFD2D2]", badge: "bg-[#FF6B6B]", label: "A" },
                    { base: "bg-[#FFF9E6] hover:bg-[#FFE0B2]", badge: "bg-[#FFB74D]", label: "B" },
                    { base: "bg-[#EBF9EB] hover:bg-[#C8E6C9]", badge: "bg-[#4CAF50]", label: "C" },
                    { base: "bg-[#E6F4FF] hover:bg-[#BBDEFB]", badge: "bg-[#2196F3]", label: "D" }
                ];

                app.innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <span class="text-sm sm:text-base font-bold text-black">🕹️ 진행률 (${currentQ + 1} / ${questions.length})</span>
                        <button onclick="toggleMute()" class="${audioBtnColor} text-black text-xs font-bold py-1 px-3 rounded-md pixel-border">
                            ${audioBtnText}
                        </button>
                    </div>

                    <div class="w-full h-4 bg-gray-100 rounded-full pixel-border p-0.5 overflow-hidden">
                        <div class="h-full bg-[#7FFF00] transition-all duration-300 rounded-full" style="width: ${progress || 5}%"></div>
                    </div>

                    <div class="flex justify-center my-0.5">
                        ${renderPixelAvatar(selectedAvatar, true)}
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl pixel-border min-h-[90px] flex items-center justify-center">
                        <p class="text-base sm:text-lg font-bold text-black leading-relaxed text-center">
                            ${q.text}
                        </p>
                    </div>

                    <div class="flex flex-col gap-2 mt-0.5">
                        ${q.options.map((opt, idx) => {
                            const isSelected = selectedOptionIdx === idx;
                            const config = optionsConfigs[idx];
                            const borderClass = isSelected ? "border-4 border-black scale-[1.01] shadow-[2px_2px_0px_rgba(0,0,0,1)]" : "border-2 border-black opacity-90";
                            return `
                                <button onclick="selectOption(${idx})" class="w-full ${config.base} text-left p-2.5 rounded-xl ${borderClass} transition-all transform cursor-pointer flex items-center gap-2.5">
                                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg ${config.badge} text-white font-black shadow-[1px_1px_0px_#000] border-2 border-black text-xs shrink-0">${config.label}</span>
                                    <span class="font-bold text-xs sm:text-sm leading-snug text-gray-900">${opt.text}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex gap-2 mt-1">
                        ${currentQ > 0 ? `
                            <button onclick="prevQuestion()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-black text-base sm:text-lg font-bold p-2.5 rounded-2xl pixel-border transition-all transform active:scale-95 cursor-pointer shadow-[2px_2px_0px_#000]">
                                이전 ↩️
                            </button>
                        ` : ''}
                        <button id="nextBtn" onclick="nextQuestion()" ${selectedOptionIdx === null ? "disabled" : ""}
                                 class="${currentQ > 0 ? 'w-2/3' : 'w-full'} text-base sm:text-lg font-bold p-2.5 rounded-2xl pixel-border transition-all transform active:scale-95 ${selectedOptionIdx === null ? "bg-gray-300 text-gray-500 cursor-not-allowed opacity-50" : "bg-[#7FFF00] text-black cursor-pointer shadow-[3px_3px_0px_#000]"}"
                                 style="animation: ${selectedOptionIdx !== null ? 'bobbing 1s infinite' : 'none'}">
                            다음 질문으로 🚀
                        </button>
                    </div>
                `;
            } 
            else if (currentScreen === "result") {
                const finalScores = calculateFinalScores();

                const pType = finalScores.P >= finalScores.I ? "P" : "I";
                const oType = finalScores.O >= finalScores.L ? "O" : "L";
                const cType = finalScores.C >= finalScores.S ? "C" : "S";
                const finalCode = pType + oType + cType;

                const details = getArchetypeDetails(finalCode);

                const pTotal = (finalScores.P + finalScores.I) || 1;
                const oTotal = (finalScores.O + finalScores.L) || 1;
                const cTotal = (finalScores.C + finalScores.S) || 1;

                const pPct = Math.round((finalScores.P / pTotal) * 100);
                const oPct = Math.round((finalScores.O / oTotal) * 100);
                const cPct = Math.round((finalScores.C / cTotal) * 100);

                const iPct = 100 - pPct;
                const lPct = 100 - oPct;
                const sPct = 100 - cPct;

                app.innerHTML = `
                    <!-- 캡처 및 진단 결과 카드 영역 -->
                    <div id="result-card" class="bg-white rounded-2xl p-1 flex flex-col gap-3">
                        <div class="text-center">
                            <h2 class="text-sm font-bold text-gray-600">마침내 찾아낸 [${userName}]의 수행평가 본캐는?!</h2>
                            <div class="my-1.5 bg-[#FFC0CB] text-xl sm:text-2xl font-retro font-bold py-2 px-4 rounded-xl pixel-border inline-block pixel-shadow text-black">
                                ${details.title}
                            </div>
                        </div>

                        <div class="flex justify-center my-0.5">
                            ${renderPixelAvatar(selectedAvatar, true)}
                        </div>

                        <div class="bg-[#FFFDE7] p-3 rounded-xl pixel-border text-center text-xs sm:text-sm font-bold leading-relaxed text-gray-800">
                            ${details.desc}
                        </div>

                        <!-- 레트로 스탯창 -->
                        <div class="bg-gray-900 text-white p-3 rounded-xl pixel-border flex flex-col gap-2">
                            <h3 class="text-xs font-bold text-[#7FFF00] flex justify-between">
                                <span>🎮 능력치 스탯창 (STATS)</span>
                                <span>TYPE: ${finalCode}</span>
                            </h3>
                            <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                                <div class="bg-gray-800 p-1.5 rounded border border-gray-700">
                                    <span class="text-gray-400">계획성</span>
                                    <span class="text-yellow-400 font-bold ml-1">LV.${Math.max(10, pPct)}</span>
                                </div>
                                <div class="bg-gray-800 p-1.5 rounded border border-gray-700">
                                    <span class="text-gray-400">독창성</span>
                                    <span class="text-green-400 font-bold ml-1">LV.${Math.max(10, oPct)}</span>
                                </div>
                                <div class="bg-gray-800 p-1.5 rounded border border-gray-700">
                                    <span class="text-gray-400">협동력</span>
                                    <span class="text-pink-400 font-bold ml-1">LV.${Math.max(10, cPct)}</span>
                                </div>
                                <div class="bg-gray-800 p-1.5 rounded border border-gray-700">
                                    <span class="text-gray-400">논리력</span>
                                    <span class="text-cyan-400 font-bold ml-1">LV.${Math.max(10, lPct)}</span>
                                </div>
                            </div>
                        </div>

                        <!-- 성향 비율 바 -->
                        <div class="flex flex-col gap-1.5 my-0.5">
                            <div class="flex flex-col gap-0.5">
                                <div class="flex justify-between text-xs font-bold">
                                    <span class="text-[#FF6B6B]">계획형 (P) ${pPct}%</span>
                                    <span class="text-[#9B5DE5]">즉흥형 (I) ${iPct}%</span>
                                </div>
                                <div class="w-full h-3 bg-gray-100 rounded-full flex overflow-hidden pixel-border">
                                    <div class="h-full bg-[#FFB6C1]" style="width: ${pPct}%"></div>
                                    <div class="h-full bg-[#DCD0FF]" style="width: ${iPct}%"></div>
                                </div>
                            </div>

                            <div class="flex flex-col gap-0.5">
                                <div class="flex justify-between text-xs font-bold">
                                    <span class="text-[#2ECC71]">독창형 (O) ${oPct}%</span>
                                    <span class="text-[#00BFFF]">논리형 (L) ${lPct}%</span>
                                </div>
                                <div class="w-full h-3 bg-gray-100 rounded-full flex overflow-hidden pixel-border">
                                    <div class="h-full bg-[#7FFF00]" style="width: ${oPct}%"></div>
                                    <div class="h-full bg-[#00BFFF]" style="width: ${lPct}%"></div>
                                </div>
                            </div>

                            <div class="flex flex-col gap-0.5">
                                <div class="flex justify-between text-xs font-bold">
                                    <span class="text-[#FF7F50]">협동형 (C) ${cPct}%</span>
                                    <span class="text-[#87CEEB]">독립형 (S) ${sPct}%</span>
                                </div>
                                <div class="w-full h-3 bg-gray-100 rounded-full flex overflow-hidden pixel-border">
                                    <div class="h-full bg-[#FF7F50]" style="width: ${cPct}%"></div>
                                    <div class="h-full bg-[#87CEEB]" style="width: ${sPct}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 찰떡 궁합 친구 유형 -->
                        <div class="bg-indigo-50 border-2 border-indigo-200 p-3 rounded-xl flex flex-col gap-1 text-left">
                            <span class="text-xs font-extrabold text-indigo-900 bg-indigo-200 px-2 py-0.5 rounded-md self-start">
                                🤝 나랑 모둠과제 하면 대박 나는 찰떡궁합 친구
                            </span>
                            <p class="text-sm font-bold text-indigo-950 mt-1">${details.friend}</p>
                            <p class="text-xs font-medium text-indigo-800 leading-snug">${details.friendDesc}</p>
                        </div>

                        <!-- 맞춤 처방전 -->
                        <div class="bg-amber-50 border-2 border-amber-300 p-3 rounded-xl flex flex-col gap-1.5 text-center">
                            <span class="text-xs font-extrabold text-amber-900 bg-amber-200 px-2 py-0.5 rounded-md self-center">
                                💡 내 유형 맞춤 솔루션
                            </span>
                            <p class="text-xs sm:text-sm font-bold text-amber-950 leading-tight">
                                ${details.cheatTitle}
                            </p>
                            <p class="text-xs font-medium text-amber-900 leading-snug">
                                ${details.cheatDesc}
                            </p>
                        </div>
                    </div>

                    <!-- 공유 버튼 -->
                    <div class="flex gap-2 my-1">
                        <button onclick="shareTestLink()" class="w-full bg-[#00BFFF] hover:bg-sky-300 text-black text-sm sm:text-base font-bold p-3 rounded-xl pixel-border transition-all transform active:scale-95 cursor-pointer pixel-shadow">
                            테스트 공유하기 🔗
                        </button>
                    </div>

                    <!-- YES24 단독 상품 구매 이동 CTA -->
                    <div class="bg-emerald-50 p-3.5 rounded-xl pixel-border flex flex-col gap-2 text-center">
                        <p class="text-xs sm:text-sm font-bold text-emerald-950 leading-snug">
                            수행평가 만점 감점 제로 치트키,<br>『한수위』 도서에서 종결!
                        </p>
                        <a href="https://www.yes24.com/product/goods/194634602" target="_blank" class="w-full block bg-[#7FFF00] hover:bg-yellow-300 text-black text-base sm:text-lg font-bold p-3 rounded-xl pixel-border transition-all transform active:scale-95 pixel-shadow">
                            [ 예스24에서 한수위 도서 구매하기 📚 ]
                        </a>
                    </div>

                    <button onclick="resetTest()" class="w-full text-center text-xs font-bold text-gray-500 underline hover:text-black cursor-pointer pt-1">
                        테스트 다시하기 🔄
                    </button>
                `;
            }
        }

        // --- Action Handlers ---
        function setAvatar(key) {
            selectedAvatar = key;
            playSfx(587.33, 0.08);
            updateApp();
        }

        function startTest() {
            if(!userName.trim()) userName = "체리토끼";
            if (isMuted) {
                isMuted = false;
                initAudio();
                startBgm();
            }
            playSfx(880.00, 0.15); 
            currentScreen = "game";
            currentQ = 0;
            selectedOptionIdx = null;
            selectedOptionIdxs = Array(20).fill(null);
            updateApp();
        }

        function selectOption(idx) {
            selectedOptionIdx = idx;
            selectedOptionIdxs[currentQ] = idx;
            playSfx(698.46, 0.05);
            updateApp();
        }

        function prevQuestion() {
            if (currentQ > 0) {
                currentQ -= 1;
                selectedOptionIdx = selectedOptionIdxs[currentQ];
                playSfx(523.25, 0.08);
                updateApp();
            }
        }

        function nextQuestion() {
            if (selectedOptionIdx === null) return;
            playSfx(880.00, 0.1);

            if (currentQ < questions.length - 1) {
                currentQ += 1;
                selectedOptionIdx = selectedOptionIdxs[currentQ];
                updateApp();
            } else {
                currentScreen = "result";
                updateApp();
            }
        }

        function resetTest() {
            userName = "체리토끼";
            selectedAvatar = "cherry";
            currentScreen = "welcome";
            currentQ = 0;
            selectedOptionIdx = null;
            selectedOptionIdxs = Array(20).fill(null);
            playSfx(440.00, 0.1);
            updateApp();
        }

        function shareTestLink() {
            const shareData = {
                title: '한수위 - 중등 수행평가 MBTI 진단 테스트',
                text: '나의 중등 수행평가 성향 본캐는 무엇일까? 지금 진단받고 치트키를 확인하세요!',
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast('테스트 주소가 클립보드에 복사되었습니다! 📋');
                }).catch(() => {
                    showToast('주소 복사에 실패했습니다.');
                });
            }
        }

        // App Initialization
        updateApp();
    </script>
</body>
</html>
